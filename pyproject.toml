[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glee-agent-research"
version = "0.1.0"
description = "GLEE leaderboard and evidence-gated research agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = [
  "communication", "eprocess", "glee", "leaderboard", "opponent_models",
  "policies", "research", "theory",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
